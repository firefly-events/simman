name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The test suite (engine + cli + gate) is headless unit tests — no real browser
    # and no vision-provider API key. Skip Playwright's browser download to keep CI fast.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    strategy:
      matrix:
        node: ["20.19", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
