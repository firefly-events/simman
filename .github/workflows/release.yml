name: Release

# Cut a release by pushing a version tag, e.g.:
#   npm version minor        # bumps package.json + creates the vX.Y.Z tag
#   git push --follow-tags
# This workflow then tests and publishes that version to npm.
#
# One-time setup: add an npm **Automation** access token (bypasses 2FA) as the
# repo secret NPM_TOKEN  (Settings → Secrets and variables → Actions).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # Safety: the pushed tag must match package.json version (vX.Y.Z == X.Y.Z).
      - name: Verify tag matches package version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag '$TAG' != package.json version '$PKG'"
            exit 1
          fi
          echo "publishing simman@$PKG"

      - run: npm test

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
