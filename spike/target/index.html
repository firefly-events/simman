<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compose — SimMan spike target</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 48px; background: #f5f6f8; }
    .card { max-width: 640px; margin: 40px auto; background: #fff; padding: 32px;
            border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin: 0 0 20px; }
    textarea { width: 100%; height: 120px; font-size: 16px; padding: 12px; box-sizing: border-box;
               border: 1px solid #ccc; border-radius: 8px; }
    #post { margin-top: 20px; font-size: 18px; font-weight: 700; color: #fff; background: #2563eb;
            border: none; padding: 16px 40px; border-radius: 8px; cursor: pointer; }
    #post:disabled { background: #9ca3af; cursor: not-allowed; }
    #confirm { display: none; margin-top: 24px; padding: 16px; background: #dcfce7; color: #166534;
               font-size: 18px; font-weight: 700; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Compose a campaign post</h1>
    <textarea id="caption" placeholder="What's happening?"></textarea>
    <button id="post" disabled>Post Now</button>
    <div id="confirm">✅ Posted! Your campaign is live.</div>
  </div>
  <script>
    const cap = document.getElementById('caption');
    const btn = document.getElementById('post');
    const ok  = document.getElementById('confirm');
    // CTA enabled only when caption non-empty (drives the cta_enabled truth-signal).
    cap.addEventListener('input', () => { btn.disabled = cap.value.trim().length === 0; });
    // Click fires the network post (drives the 'posted' truth-signal) + shows confirmation.
    btn.addEventListener('click', () => {
      fetch('/api/social/post', { method: 'POST' }).catch(() => {});
      ok.style.display = 'block';
      btn.textContent = 'Posted';
    });
  </script>
</body>
</html>
